<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>السياسات القانونية — LAQTA | Legal</title>
<style>
  :root{--ink:#0A1F2E;--gold:#D6A44A;--muted:#5b6570;--bg:#fafaf8;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Tajawal","Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.9;}
  header{background:var(--ink);color:#fff;padding:36px 20px;text-align:center;}
  header .brand{color:var(--gold);font-weight:800;font-size:30px;letter-spacing:1px;}
  header p{color:#cfd6dc;margin-top:6px;font-size:15px;}
  main{max-width:640px;margin:0 auto;padding:36px 20px 60px;display:grid;gap:14px;}
  a.card{display:block;background:#fff;border:1px solid #e8e6e0;border-radius:16px;padding:18px 20px;
         text-decoration:none;color:var(--ink);transition:border-color .15s;}
  a.card:hover{border-color:var(--gold);}
  a.card .t{font-weight:800;font-size:17px;}
  a.card .s{color:var(--muted);font-size:13px;margin-top:2px;}
  footer{max-width:640px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:13px;text-align:center;}
</style>
</head>
<body>
<header>
  <div class="brand">LAQTA — لقطة</div>
  <p>منصة حجز المصورين والقاعات وأماكن التصوير · السياسات القانونية</p>
</header>
<main>
  <a class="card" href="privacy.html">
    <div class="t">سياسة الخصوصية</div><div class="s">Privacy Policy</div>
  </a>
  <a class="card" href="terms.html">
    <div class="t">شروط الخدمة</div><div class="s">Terms of Service</div>
  </a>
  <a class="card" href="delete-account.html">
    <div class="t">سياسة حذف الحساب</div><div class="s">Account Deletion Policy</div>
  </a>
  <a class="card" href="content-policy.html">
    <div class="t">سياسة المحتوى</div><div class="s">Content Policy</div>
  </a>
</main>
<footer>support@laqta.cloud · © LAQTA</footer>
</body>
</html>
